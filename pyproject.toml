[tool.poetry]
package-mode = false
name = "accessory-validator"
version = "0.1.0"
description = "Classifies bicycle accessories as leasable or not leasable"
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
fastapi = "0.116.1"
pydantic = "2.11.7"
pydantic-settings = "2.10.1"
uvicorn = "0.35.0"

[tool.poetry.group.dev.dependencies]
httpx = "0.28.1"
mypy = "2.3.1"
pre-commit = "4.2.0"
pytest = "8.4.1"
pytest-asyncio = "0.25.0"
ruff = "0.12.3"

[tool.pytest.ini_options]
testpaths = ["app/tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
